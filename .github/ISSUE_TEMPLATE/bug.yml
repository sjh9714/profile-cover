name: Bug report
description: A strip rendered wrong, the checker missed something, or a doc is wrong.
labels: [bug]
body:
  - type: input
    id: agent
    attributes:
      label: Agent and OS
      placeholder: "Claude Code on macOS"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The SVG or README snippet, checker output, and what you expected.
    validations:
      required: true
